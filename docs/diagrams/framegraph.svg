<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#455A64"/></marker></defs><rect width="1440" height="900" fill="white"/><text x="720" y="28" font-size="19" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle" font-weight="bold">FrameGraph：虚拟资源图 → 编译 → 执行</text><rect x="30" y="70" width="430" height="130" rx="8" fill="('#E3F2FD', '#1565C0')" stroke="#1565C0" stroke-width="1.6"/><text x="245.0" y="96" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="245.0" y="96" font-size="14" font-weight="bold">构建：addPass(name, setup, execute)</tspan></text><text x="245.0" y="114" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="245.0" y="114" font-size="13" font-weight="normal">setup 同步执行：builder.read/write/sample/create</tspan><tspan x="245.0" y="132" font-size="13" font-weight="normal">只声明资源依赖，不发命令</tspan><tspan x="245.0" y="150" font-size="13" font-weight="normal">execute 存起来，fg.execute() 才执行</tspan></text><line x1="460" y1="120" x2="560" y2="120" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="560" y="60" width="430" height="160" rx="8" fill="('#E3F2FD', '#1565C0')" stroke="#1565C0" stroke-width="1.6"/><text x="775.0" y="86" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="775.0" y="86" font-size="14" font-weight="bold">compile()</tspan></text><text x="775.0" y="104" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="775.0" y="104" font-size="13" font-weight="normal">① 依赖图 cull：无引用的 pass 被裁剪</tspan><tspan x="775.0" y="122" font-size="13" font-weight="normal">② 每个资源算 refcount / first / last</tspan><tspan x="775.0" y="140" font-size="13" font-weight="normal">③ 生成 devirtualize（首个使用者）与</tspan><tspan x="775.0" y="158" font-size="13" font-weight="normal">   destroy（末个使用者）列表</tspan><tspan x="775.0" y="176" font-size="13" font-weight="normal">④ 合并 usage 位</tspan></text><line x1="990" y1="120" x2="1090" y2="120" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1090" y="60" width="330" height="160" rx="8" fill="('#FFF3E0', '#E65100')" stroke="#1565C0" stroke-width="1.6"/><text x="1255.0" y="86" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1255.0" y="86" font-size="14" font-weight="bold">execute(driver)</tspan></text><text x="1255.0" y="104" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1255.0" y="104" font-size="13" font-weight="normal">按 pass 顺序：</tspan><tspan x="1255.0" y="122" font-size="13" font-weight="normal">devirtualize → node-&gt;execute(driver)</tspan><tspan x="1255.0" y="140" font-size="13" font-weight="normal">→ destroy</tspan><tspan x="1255.0" y="158" font-size="13" font-weight="normal">真正发命令的地方</tspan></text><rect x="560" y="270" width="860" height="110" rx="8" fill="('#E3F2FD', '#1565C0')" stroke="#1565C0" stroke-width="1.6"/><text x="990.0" y="296" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="990.0" y="296" font-size="14" font-weight="bold">本帧的 pass 链（renderJob 构建）</tspan></text><rect x="580" y="320" width="102" height="44" rx="8" fill="('#F3E5F5', '#6A1B9A')" stroke="#1565C0" stroke-width="1.6"/><text x="631.0" y="354" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="631.0" y="354" font-size="10" font-weight="normal">Shadow pass</tspan></text><line x1="682" y1="342" x2="694" y2="342" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="698" y="320" width="102" height="44" rx="8" fill="('#F3E5F5', '#6A1B9A')" stroke="#1565C0" stroke-width="1.6"/><text x="749.0" y="354" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="749.0" y="354" font-size="10" font-weight="normal">Structure/SSAO</tspan></text><line x1="800" y1="342" x2="812" y2="342" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="816" y="320" width="102" height="44" rx="8" fill="('#F3E5F5', '#6A1B9A')" stroke="#1565C0" stroke-width="1.6"/><text x="867.0" y="354" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="867.0" y="354" font-size="10" font-weight="normal">Color pass</tspan></text><line x1="918" y1="342" x2="930" y2="342" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="934" y="320" width="102" height="44" rx="8" fill="('#F3E5F5', '#6A1B9A')" stroke="#1565C0" stroke-width="1.6"/><text x="985.0" y="354" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="985.0" y="354" font-size="10" font-weight="normal">Refraction</tspan></text><line x1="1036" y1="342" x2="1048" y2="342" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1052" y="320" width="102" height="44" rx="8" fill="('#F3E5F5', '#6A1B9A')" stroke="#1565C0" stroke-width="1.6"/><text x="1103.0" y="354" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1103.0" y="354" font-size="10" font-weight="normal">TAA/Bloom/DoF</tspan></text><line x1="1154" y1="342" x2="1166" y2="342" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1170" y="320" width="102" height="44" rx="8" fill="('#F3E5F5', '#6A1B9A')" stroke="#1565C0" stroke-width="1.6"/><text x="1221.0" y="354" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1221.0" y="354" font-size="10" font-weight="normal">色调映射/FXAA</tspan></text><line x1="1272" y1="342" x2="1284" y2="342" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1288" y="320" width="102" height="44" rx="8" fill="('#F3E5F5', '#6A1B9A')" stroke="#1565C0" stroke-width="1.6"/><text x="1339.0" y="354" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1339.0" y="354" font-size="10" font-weight="normal">present</tspan></text><rect x="30" y="280" width="460" height="110" rx="8" fill="('#F3E5F5', '#6A1B9A')" stroke="#1565C0" stroke-width="1.6"/><text x="260.0" y="306" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="260.0" y="306" font-size="14" font-weight="bold">VirtualResource</tspan></text><text x="260.0" y="324" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="260.0" y="324" font-size="13" font-weight="normal">声明阶段只有 descriptor（虚拟的）</tspan><tspan x="260.0" y="342" font-size="13" font-weight="normal">refcount / first / last 在 compile 计算</tspan></text><line x1="250" y1="390" x2="250" y2="450" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="30" y="450" width="460" height="130" rx="8" fill="('#E8F5E9', '#2E7D32')" stroke="#1565C0" stroke-width="1.6"/><text x="260.0" y="476" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="260.0" y="476" font-size="14" font-weight="bold">devirtualize → 实例化</tspan></text><text x="260.0" y="494" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="260.0" y="494" font-size="13" font-weight="normal">FrameGraphTexture::create</tspan><tspan x="260.0" y="512" font-size="13" font-weight="normal">→ TextureCache::createTexture</tspan><tspan x="260.0" y="530" font-size="13" font-weight="normal">→ driverApi.createTexture（入队）</tspan><tspan x="260.0" y="548" font-size="13" font-weight="normal">→ OpenGL 纹理对象</tspan></text><rect x="30" y="630" width="460" height="120" rx="8" fill="('#F5F5F5', '#616161')" stroke="#1565C0" stroke-width="1.6"/><text x="260.0" y="656" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="260.0" y="656" font-size="14" font-weight="bold">TextureCache（资源池）</tspan></text><text x="260.0" y="674" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="260.0" y="674" font-size="13" font-weight="normal">按 descriptor 做键缓存</tspan><tspan x="260.0" y="692" font-size="13" font-weight="normal">跨帧复用，延迟销毁（gc）</tspan><tspan x="260.0" y="710" font-size="13" font-weight="normal">避免每帧反复创建中间缓冲</tspan></text><line x1="250" y1="580" x2="250" y2="630" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1090" y="300" width="330" height="110" rx="8" fill="('#EDE7F6', '#4527A0')" stroke="#1565C0" stroke-width="1.6"/><text x="1255.0" y="326" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1255.0" y="326" font-size="14" font-weight="bold">import viewRenderTarget</tspan></text><text x="1255.0" y="344" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1255.0" y="344" font-size="13" font-weight="normal">外部资源 = 默认 RenderTarget</tspan><tspan x="1255.0" y="362" font-size="13" font-weight="normal">本项目 = Qt 的 FBO</tspan></text><line x1="1230" y1="410" x2="1230" y2="480" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1230.0" y="439.0" font-size="11" fill="#455A64" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">forwardResource + present</text><rect x="1090" y="480" width="330" height="110" rx="8" fill="('#EDE7F6', '#4527A0')" stroke="#1565C0" stroke-width="1.6"/><text x="1255.0" y="506" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1255.0" y="506" font-size="14" font-weight="bold">最终输出</tspan></text><text x="1255.0" y="524" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1255.0" y="524" font-size="13" font-weight="normal">后处理结果被转发进 Qt FBO</tspan><tspan x="1255.0" y="542" font-size="13" font-weight="normal">Filament 自己不 swap</tspan></text><rect x="560" y="430" width="860" height="100" rx="8" fill="('#F5F5F5', '#616161')" stroke="#1565C0" stroke-width="1.6"/><text x="990.0" y="456" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="990.0" y="456" font-size="14" font-weight="bold">present pass（副作用）</tspan></text><text x="990.0" y="474" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="990.0" y="474" font-size="13" font-weight="normal">fg.present(viewRenderTarget)：声明输出副作用，防止被依赖图裁剪</tspan></text><line x1="990" y1="330" x2="990" y2="430" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6,4"/><text x="990.0" y="374.0" font-size="11" fill="#455A64" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">pass 链</text><line x1="720" y1="530" x2="720" y2="590" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="560" y="590" width="860" height="100" rx="8" fill="('#F5F5F5', '#616161')" stroke="#1565C0" stroke-width="1.6"/><text x="990.0" y="616" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="990.0" y="616" font-size="14" font-weight="bold">FrameGraph 自身的 arena</tspan></text><text x="990.0" y="634" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="990.0" y="634" font-size="13" font-weight="normal">PassNode / ResourceNode 分配在 mArena（256 KiB），随 fg 析构</tspan></text></svg>