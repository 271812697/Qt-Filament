<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#455A64"/></marker></defs><rect width="1240" height="800" fill="white"/><text x="620" y="28" font-size="19" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle" font-weight="bold">Arena 分配器：一帧内的三层内存</text><rect x="60" y="70" width="500" height="180" rx="8" fill="('#F3E5F5', '#6A1B9A')" stroke="#1565C0" stroke-width="1.6"/><text x="310.0" y="96" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="310.0" y="96" font-size="14" font-weight="bold">FEngine::mPerRenderPassArena</tspan></text><text x="310.0" y="114" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="310.0" y="114" font-size="13" font-weight="normal">LinearAllocatorArena（线性 bump）</tspan><tspan x="310.0" y="132" font-size="13" font-weight="normal">Engine 创建时按 perRenderPassArenaSizeMB 分配</tspan><tspan x="310.0" y="150" font-size="13" font-weight="normal">跨帧复用，整块常驻</tspan></text><line x1="310" y1="250" x2="310" y2="320" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><text x="310.0" y="279.0" font-size="11" fill="#455A64" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">每帧 renderInternal 里：</text><rect x="60" y="320" width="500" height="120" rx="8" fill="('#E3F2FD', '#1565C0')" stroke="#1565C0" stroke-width="1.6"/><text x="310.0" y="346" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="310.0" y="346" font-size="14" font-weight="bold">RootArenaScope rootArenaScope(arena)</tspan></text><text x="310.0" y="364" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="310.0" y="364" font-size="13" font-weight="normal">构造：记录 rewind 点</tspan><tspan x="310.0" y="382" font-size="13" font-weight="normal">作用域内 allocate = 指针后移（零开销）</tspan><tspan x="310.0" y="400" font-size="13" font-weight="normal">析构：finalizer 链 + arena.rewind()</tspan></text><line x1="310" y1="440" x2="310" y2="510" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><text x="310.0" y="469.0" font-size="11" fill="#455A64" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">allocate(perFrameCommandsSize)</text><rect x="60" y="510" width="500" height="150" rx="8" fill="('#FFF3E0', '#E65100')" stroke="#1565C0" stroke-width="1.6"/><text x="310.0" y="536" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="310.0" y="536" font-size="14" font-weight="bold">per-frame 命令区</tspan></text><text x="310.0" y="554" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="310.0" y="554" font-size="13" font-weight="normal">RenderPass::Arena（StaticArea +</tspan><tspan x="310.0" y="572" font-size="13" font-weight="normal">LinearAllocatorWithFallback + HighWatermark）</tspan><tspan x="310.0" y="590" font-size="13" font-weight="normal">64 字节 Command[] 都分配在这里</tspan><tspan x="310.0" y="608" font-size="13" font-weight="normal">renderJob 结束整块归还</tspan></text><text x="310" y="690" font-size="12" fill="#C62828" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle" font-weight="bold">溢出 → debug 构建 abort，调大 Engine::Config::perFrameCommandsSizeMB</text><rect x="680" y="70" width="500" height="180" rx="8" fill="('#F5F5F5', '#616161')" stroke="#1565C0" stroke-width="1.6"/><text x="930.0" y="96" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="930.0" y="96" font-size="14" font-weight="bold">renderJob 里其它临时对象</tspan></text><text x="930.0" y="114" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="930.0" y="114" font-size="13" font-weight="normal">剔除距离缓冲、灯光距离缓冲……</tspan><tspan x="930.0" y="132" font-size="13" font-weight="normal">全部从 RootArenaScope 分配</tspan><tspan x="930.0" y="150" font-size="13" font-weight="normal">作用域结束一并回收</tspan></text><line x1="930" y1="250" x2="930" y2="320" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="680" y="320" width="500" height="140" rx="8" fill="('#F5F5F5', '#616161')" stroke="#1565C0" stroke-width="1.6"/><text x="930.0" y="346" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="930.0" y="346" font-size="14" font-weight="bold">FrameGraph 内部 mArena（独立）</tspan></text><text x="930.0" y="364" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="930.0" y="364" font-size="13" font-weight="normal">“FrameGraph Arena”, 262144 字节（256 KiB）</tspan><tspan x="930.0" y="382" font-size="13" font-weight="normal">PassNode / ResourceNode / 依赖边</tspan><tspan x="930.0" y="400" font-size="13" font-weight="normal">随 fg 对象析构</tspan></text><line x1="930" y1="460" x2="930" y2="530" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="680" y="530" width="500" height="130" rx="8" fill="('#E3F2FD', '#1565C0')" stroke="#1565C0" stroke-width="1.6"/><text x="930.0" y="556" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="930.0" y="556" font-size="14" font-weight="bold">为什么用 Arena</tspan></text><text x="930.0" y="574" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="930.0" y="574" font-size="13" font-weight="normal">每帧大量短命对象，逐对象 free 是浪费</tspan><tspan x="930.0" y="592" font-size="13" font-weight="normal">线性分配 + 整块回退 = 无碎片、无锁</tspan><tspan x="930.0" y="610" font-size="13" font-weight="normal">HighWatermark 监控水位，指导调参</tspan></text></svg>