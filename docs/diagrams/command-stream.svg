y="154" font-size="13" font-weight="normal">allocateCommand()</tspan><tspan x="485.0" y="172" font-size="13" font-weight="normal">placement new</tspan><tspan x="485.0" y="190" font-size="13" font-weight="normal">函数指针 + 参数 tuple</tspan></text><line x1="310" y1="220" x2="310" y2="290" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="290" width="560" height="150" rx="8" fill="('#FFF3E0', '#E65100')" stroke="#1565C0" stroke-width="1.6"/><text x="320.0" y="316" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="320.0" y="316" font-size="14" font-weight="bold">CircularBuffer（环形缓冲）</tspan></text><text x="320.0" y="334" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="320.0" y="334" font-size="13" font-weight="normal">固定容量、页对齐</tspan><tspan x="320.0" y="352" font-size="13" font-weight="normal">allocate = mHead += size（bump）</tspan><tspan x="320.0" y="370" font-size="13" font-weight="normal">head/tail 指针</tspan></text><line x1="310" y1="440" x2="310" y2="510" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><text x="310.0" y="469.0" font-size="11" fill="#455A64" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">flush()</text><rect x="40" y="510" width="560" height="180" rx="8" fill="('#FFF3E0', '#E65100')" stroke="#1565C0" stroke-width="1.6"/><text x="320.0" y="536" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="320.0" y="536" font-size="14" font-weight="bold">CommandBufferQueue</tspan></text><text x="320.0" y="554" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="320.0" y="554" font-size="13" font-weight="normal">追加 NoopCommand(nullptr) 终止命令</tspan><tspan x="320.0" y="572" font-size="13" font-weight="normal">把 [tail, head) 压入 mCommandBuffersToExecute</tspan><tspan x="320.0" y="590" font-size="13" font-weight="normal">mCondition.notify_one()</tspan><tspan x="320.0" y="608" font-size="13" font-weight="normal">剩余空间 &lt; requiredSize → 阻塞等待</tspan><tspan x="320.0" y="626" font-size="13" font-weight="normal">溢出 → “Backend CommandStream overflow”</tspan></text><line x1="600" y1="600" x2="720" y2="600" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><text x="660" y="585" font-size="11" fill="#455A64" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">notify / wait</text><rect x="720" y="60" width="640" height="150" rx="8" fill="('#E8F5E9', '#2E7D32')" stroke="#1565C0" stroke-width="1.6"/><text x="1040.0" y="86" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1040.0" y="86" font-size="14" font-weight="bold">消费者（驱动线程，或单线程构建的 execute()）</tspan></text><rect x="740" y="110" width="280" height="80" rx="8" fill="('#E8F5E9', '#2E7D32')" stroke="#1565C0" stroke-width="1.6"/><text x="880.0" y="136" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="880.0" y="136" font-size="14" font-weight="bold">waitForCommands()</tspan></text><text x="880.0" y="154" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="880.0" y="154" font-size="13" font-weight="normal">多线程：阻塞等待</tspan><tspan x="880.0" y="172" font-size="13" font-weight="normal">单线程：直接返回缓冲</tspan></text><line x1="1020" y1="140" x2="1100" y2="140" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1100" y="100" width="240" height="90" rx="8" fill="('#E8F5E9', '#2E7D32')" stroke="#1565C0" stroke-width="1.6"/><text x="1220.0" y="126" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1220.0" y="126" font-size="14" font-weight="bold">CommandStream::execute(buffer)</tspan></text><text x="1220.0" y="144" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1220.0" y="144" font-size="13" font-weight="normal">while (p) p = p-&gt;execute(driver)</tspan></text><line x1="1240" y1="210" x2="1240" y2="280" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="720" y="280" width="640" height="130" rx="8" fill="('#F3E5F5', '#6A1B9A')" stroke="#1565C0" stroke-width="1.6"/><text x="1040.0" y="306" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1040.0" y="306" font-size="14" font-weight="bold">CommandBase 链</tspan></text><text x="1040.0" y="324" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1040.0" y="324" font-size="13" font-weight="normal">CommandBase { Execute mExecute }   // 函数指针</tspan><tspan x="1040.0" y="342" font-size="13" font-weight="normal">Command&lt;&amp;Driver::method&gt; { std::tuple&lt;参数...&gt; mArgs }</tspan><tspan x="1040.0" y="360" font-size="13" font-weight="normal">mExecute → Dispatcher 函数指针表</tspan></text><line x1="1240" y1="410" x2="1240" y2="480" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="720" y="480" width="640" height="140" rx="8" fill="('#FFF3E0', '#E65100')" stroke="#1565C0" stroke-width="1.6"/><text x="1040.0" y="506" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1040.0" y="506" font-size="14" font-weight="bold">ConcreteDispatcher&lt;OpenGLDriver&gt;::method</tspan></text><text x="1040.0" y="524" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1040.0" y="524" font-size="13" font-weight="normal">static_cast&lt;OpenGLDriver&amp;&gt;(driver)</tspan><tspan x="1040.0" y="542" font-size="13" font-weight="normal">Cmd::execute(&amp;OpenGLDriver::method, driver, base, next)</tspan><tspan x="1040.0" y="560" font-size="13" font-weight="normal">apply() 展开 tuple → (driver.*method)(args...)</tspan><tspan x="1040.0" y="578" font-size="13" font-weight="normal">→ OpenGLDriver 成员函数 → 真实 GL 调用</tspan></text><line x1="1240" y1="620" x2="1240" y2="700" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6,4"/><text x="1240.0" y="654.0" font-size="11" fill="#455A64" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">releaseBuffer() 归还空间</text><rect x="720" y="700" width="640" height="90" rx="8" fill="('#F5F5F5', '#616161')" stroke="#1565C0" stroke-width="1.6"/><text x="1040.0" y="726" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1040.0" y="726" font-size="14" font-weight="bold">FEngine::loop（多线程） / Engine::execute（单线程）</tspan></text><text x="1040.0" y="744" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1040.0" y="744" font-size="13" font-weight="normal">多线程：命令在驱动线程执行</tspan><tspan x="1040.0" y="762" font-size="13" font-weight="normal">单线程（本项目）：命令在 GUI 线程执行</tspan></text></svg>