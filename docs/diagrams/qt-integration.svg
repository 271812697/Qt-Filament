<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#455A64"/></marker></defs><rect width="1240" height="800" fill="white"/><text x="620" y="28" font-size="19" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle" font-weight="bold">Qt 集成层：PlatformGlfwGL 与 FBO 链路</text><rect x="40" y="70" width="360" height="140" rx="8" fill="('#EDE7F6', '#4527A0')" stroke="#1565C0" stroke-width="1.6"/><text x="220.0" y="96" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="220.0" y="96" font-size="14" font-weight="bold">DebugOpenGLWidget</tspan></text><text x="220.0" y="114" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="220.0" y="114" font-size="13" font-weight="normal">initializeGL：build engine / swapchain</tspan><tspan x="220.0" y="132" font-size="13" font-weight="normal">paintGL：render + execute</tspan><tspan x="220.0" y="150" font-size="13" font-weight="normal">resizeEvent：viewport + manipulator</tspan></text><line x1="400" y1="120" x2="500" y2="120" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="500" y="60" width="420" height="170" rx="8" fill="('#EDE7F6', '#4527A0')" stroke="#1565C0" stroke-width="1.6"/><text x="710.0" y="86" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="710.0" y="86" font-size="14" font-weight="bold">PlatformGlfwGL（自定义 OpenGLPlatform）</tspan></text><rect x="520" y="110" width="380" height="100" rx="8" fill="('#EDE7F6', '#4527A0')" stroke="#1565C0" stroke-width="1.6"/><text x="710.0" y="136" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="710.0" y="136" font-size="14" font-weight="bold">关键 override</tspan></text><text x="710.0" y="154" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="710.0" y="154" font-size="13" font-weight="normal">createSwapChain → 原样返回 widget 指针</tspan><tspan x="710.0" y="172" font-size="13" font-weight="normal">makeCurrent → true（no-op）</tspan><tspan x="710.0" y="190" font-size="13" font-weight="normal">commit → no-op</tspan><tspan x="710.0" y="208" font-size="13" font-weight="normal">getDefaultFramebufferObject → Qt FBO</tspan></text><line x1="920" y1="130" x2="1020" y2="130" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1020" y="60" width="190" height="150" rx="8" fill="('#E8F5E9', '#2E7D32')" stroke="#1565C0" stroke-width="1.6"/><text x="1115.0" y="86" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1115.0" y="86" font-size="14" font-weight="bold">OpenGLDriver</tspan></text><text x="1115.0" y="104" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1115.0" y="104" font-size="13" font-weight="normal">创建时 bluegl::bind()</tspan><tspan x="1115.0" y="122" font-size="13" font-weight="normal">查询 FBO / makeCurrent / commit</tspan></text><rect x="40" y="300" width="360" height="150" rx="8" fill="('#F3E5F5', '#6A1B9A')" stroke="#1565C0" stroke-width="1.6"/><text x="220.0" y="326" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="220.0" y="326" font-size="14" font-weight="bold">SwapChain = QOpenGLWidget*</tspan></text><text x="220.0" y="344" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="220.0" y="344" font-size="13" font-weight="normal">createSwapChain(this, 0)</tspan><tspan x="220.0" y="362" font-size="13" font-weight="normal">Filament 认为它是 nativeWindow</tspan><tspan x="220.0" y="380" font-size="13" font-weight="normal">真正渲染目标是 Qt 的 FBO</tspan></text><line x1="400" y1="360" x2="520" y2="360" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><text x="420" y="345" font-size="11" fill="#455A64" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">makeCurrent / commit 无操作的前提：</text><rect x="500" y="300" width="420" height="150" rx="8" fill="('#E8F5E9', '#2E7D32')" stroke="#1565C0" stroke-width="1.6"/><text x="710.0" y="326" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="710.0" y="326" font-size="14" font-weight="bold">Qt 负责上下文与呈现</tspan></text><text x="710.0" y="344" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="710.0" y="344" font-size="13" font-weight="normal">paintGL 时 context 已 current</tspan><tspan x="710.0" y="362" font-size="13" font-weight="normal">Qt 合成器呈现 widget 内容</tspan><tspan x="710.0" y="380" font-size="13" font-weight="normal">Filament 不 swap，只写 FBO</tspan></text><line x1="920" y1="360" x2="1020" y2="360" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1020" y="300" width="190" height="150" rx="8" fill="('#FFEBEE', '#C62828')" stroke="#1565C0" stroke-width="1.6"/><text x="1115.0" y="326" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1115.0" y="326" font-size="14" font-weight="bold">单线程构建</tspan></text><text x="1115.0" y="344" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1115.0" y="344" font-size="13" font-weight="normal">FILAMENT_SINGLE_THREADED</tspan><tspan x="1115.0" y="362" font-size="13" font-weight="normal">Engine::execute() 在 GUI 线程</tspan></text><rect x="40" y="540" width="1160" height="90" rx="8" fill="('#FFEBEE', '#C62828')" stroke="#1565C0" stroke-width="1.6"/><text x="620.0" y="566" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="620.0" y="566" font-size="14" font-weight="bold">改多线程时要注意</tspan></text><text x="620.0" y="584" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="620.0" y="584" font-size="13" font-weight="normal">去掉 FILAMENT_SINGLE_THREADED 后 Engine::execute() 会 precondition panic</tspan><tspan x="620.0" y="602" font-size="13" font-weight="normal">PlatformGlfwGL 的 makeCurrent/commit 必须实现真实语义（QOpenGLContext 迁移）</tspan><tspan x="620.0" y="620" font-size="13" font-weight="normal">QOpenGLWidget 的 FBO 只在 context current 时有效</tspan></text><line x1="310" y1="450" x2="310" y2="540" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6,4"/><text x="310.0" y="489.0" font-size="11" fill="#455A64" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">高 DPI / resize：viewport 用物理像素</text></svg>