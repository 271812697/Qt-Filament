<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#455A64"/></marker></defs><rect width="1240" height="620" fill="white"/><text x="620" y="30" font-size="19" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle" font-weight="bold">OpenGL 上下文模型：状态 + 资源 + 共享组</text><rect x="40" y="90" width="320" height="90" rx="8" fill="('#F5F5F5', '#616161')" stroke="#1565C0" stroke-width="1.6"/><text x="200.0" y="116" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="200.0" y="116" font-size="14" font-weight="bold">线程 A</tspan></text><text x="200.0" y="134" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="200.0" y="134" font-size="13" font-weight="normal">ctxA 为 current</tspan><tspan x="200.0" y="152" font-size="13" font-weight="normal">同一线程同时只有一个 current</tspan></text><rect x="40" y="240" width="320" height="90" rx="8" fill="('#F5F5F5', '#616161')" stroke="#1565C0" stroke-width="1.6"/><text x="200.0" y="266" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="200.0" y="266" font-size="14" font-weight="bold">线程 B</tspan></text><text x="200.0" y="284" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="200.0" y="284" font-size="13" font-weight="normal">ctxB 为 current</tspan><tspan x="200.0" y="302" font-size="13" font-weight="normal">一个上下文同一时刻</tspan><tspan x="200.0" y="320" font-size="13" font-weight="normal">只能在一个线程 current</tspan></text><line x1="360" y1="135" x2="470" y2="135" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><text x="415.0" y="129.0" font-size="11" fill="#455A64" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">makeCurrent</text><line x1="360" y1="285" x2="470" y2="285" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><text x="415.0" y="279.0" font-size="11" fill="#455A64" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">makeCurrent</text><rect x="470" y="60" width="330" height="200" rx="8" fill="('#FFF3E0', '#E65100')" stroke="#1565C0" stroke-width="1.6"/><text x="635.0" y="86" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="635.0" y="86" font-size="14" font-weight="bold">上下文 ctxA（驱动端状态机）</tspan></text><text x="635.0" y="104" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="635.0" y="104" font-size="13" font-weight="normal">current program / VAO</tspan><tspan x="635.0" y="122" font-size="13" font-weight="normal">绑定中的纹理/缓冲</tspan><tspan x="635.0" y="140" font-size="13" font-weight="normal">blend / depth / viewport …</tspan><tspan x="635.0" y="158" font-size="13" font-weight="normal">纹理、缓冲等对象的命名空间</tspan></text><rect x="470" y="290" width="330" height="200" rx="8" fill="('#FFF3E0', '#E65100')" stroke="#1565C0" stroke-width="1.6"/><text x="635.0" y="316" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="635.0" y="316" font-size="14" font-weight="bold">上下文 ctxB（另一份独立状态）</tspan></text><text x="635.0" y="334" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="635.0" y="334" font-size="13" font-weight="normal">状态互不影响</tspan><tspan x="635.0" y="352" font-size="13" font-weight="normal">对象命名空间独立</tspan></text><line x1="800" y1="130" x2="900" y2="130" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/><text x="850.0" y="124.0" font-size="11" fill="#455A64" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">资源可共享</text><rect x="900" y="60" width="310" height="210" rx="8" fill="('#E8F5E9', '#2E7D32')" stroke="#1565C0" stroke-width="1.6"/><text x="1055.0" y="86" fill="#1565C0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1055.0" y="86" font-size="14" font-weight="bold">共享组（share group）</tspan></text><text x="1055.0" y="104" fill="#212121" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle"><tspan x="1055.0" y="104" font-size="13" font-weight="normal">共享：纹理 / 缓冲 / program</tspan><tspan x="1055.0" y="122" font-size="13" font-weight="normal">共享：renderbuffer / sampler / sync</tspan><tspan x="1055.0" y="140" font-size="13" font-weight="normal">不共享：FBO / VAO / query /</tspan><tspan x="1055.0" y="158" font-size="13" font-weight="normal">transform feedback / pipeline</tspan></text><text x="620" y="540" font-size="13" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" text-anchor="middle">结论：FBO/VAO 是上下文私有的 → 跨线程呈现必须走「共享纹理 + blit」，而不是直接绑对方的 FBO</text></svg>